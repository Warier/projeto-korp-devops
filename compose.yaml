name: projeto-korp

services:
  http-server-projeto-korp:
    build: .
    image: http-server-projeto-korp:dev
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - korp

  nginx:
    image: nginx:1.30.4-alpine3.24-slim
    restart: unless-stopped
    depends_on:
      - http-server-projeto-korp
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./infra/nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,noexec,nosuid
      - /var/run:size=1m,mode=0755,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/projeto-korp"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - korp

networks:
  korp:
    driver: bridge
