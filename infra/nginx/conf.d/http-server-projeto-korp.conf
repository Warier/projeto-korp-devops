resolver 127.0.0.11 valid=10s ipv6=off;

log_format korp_metrics '"$request_method /projeto-korp $server_protocol" '
                        '$status $body_bytes_sent $request_time';

map $uri $korp_api_request {
    default 0;
    /projeto-korp 1;
}

map $remote_addr $korp_loggable {
    default $korp_api_request;
    127.0.0.1 0;
    ::1 0;
}

upstream korp_backend {
    zone korp_backend 64k;
    server http-server-projeto-korp:8080 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /dev/stdout combined;
    access_log syslog:server=127.0.0.1:5531,tag=korp korp_metrics if=$korp_loggable;

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://korp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
